name: Test Suite

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Cross-platform matrix (Ubuntu / Windows / macOS × Node 20 / 22)
#          Covers all 14 platform-safe framework adapters.
#          Electron + Tauri native spawns are skipped via LUNX_SKIP_NATIVE=1.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  test:
    name: 🧪 Node ${{ matrix.node }} on ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: 🔍 Environment info
        shell: bash
        run: |
          node --version
          npm --version
          echo "OS: ${{ matrix.os }}"

      - name: 📦 Install dependencies
        shell: bash
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build
        shell: bash
        run: npm run build

      - name: 🧪 Run test suite
        shell: bash
        run: npm test
        env:
          LUNX_SKIP_SECURITY: '1'
          LUNX_SKIP_NATIVE: '1'      # skips Electron/Tauri spawns — tested separately below
          CI: 'true'

      - name: 📤 Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            *.log
            test-results/
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — Native adapters: Electron + Tauri (Ubuntu only, Node 20)
#          Runs after the main matrix succeeds.
#          Installs Rust + cargo for Tauri. Uses electron npm package for Electron.
# ─────────────────────────────────────────────────────────────────────────────
  test-native:
    name: 🔩 Native adapters (Electron + Tauri) on ubuntu-latest
    needs: test
    timeout-minutes: 45
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🦀 Setup Rust + cargo (required for Tauri)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: 🗂️ Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 🖥️ Install Linux system deps for Tauri (WebView2 / webkit2gtk)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 📦 Install Node dependencies
        shell: bash
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build Lunx (with native binary)
        shell: bash
        run: npm run build
        env:
          DEBUG: '1'

      - name: 🔩 Test Electron adapter fixture
        shell: bash
        run: |
          cd e2e/fixtures/electron-notes
          npm install --legacy-peer-deps
          node -e "
            const { ElectronAdapter } = require('../../../dist/meta-frameworks/electron/index.js');
            const adapter = new ElectronAdapter();
            console.log('Electron adapter name:', adapter.name);
            const pkg = require('./package.json');
            const detected = adapter.detect('.', pkg);
            console.log('Electron detected:', detected);
            if (adapter.name !== 'electron') throw new Error('name wrong');
            console.log('✅ Electron adapter OK');
          "
        env:
          CI: 'true'
          LUNX_SKIP_SECURITY: '1'

      - name: 🔩 Test Tauri adapter fixture
        shell: bash
        run: |
          cd e2e/fixtures/tauri-file-manager
          npm install --legacy-peer-deps
          node -e "
            const { TauriAdapter } = require('../../../dist/meta-frameworks/tauri/index.js');
            const adapter = new TauriAdapter();
            console.log('Tauri adapter name:', adapter.name);
            const pkg = require('./package.json');
            const detected = adapter.detect('.', pkg);
            console.log('Tauri detected:', detected);
            if (adapter.name !== 'tauri') throw new Error('name wrong');
            console.log('✅ Tauri adapter OK');
          "
        env:
          CI: 'true'
          LUNX_SKIP_SECURITY: '1'

      - name: 📤 Upload native test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-native-ubuntu
          path: |
            *.log
            e2e/fixtures/electron-notes/*.log
            e2e/fixtures/tauri-file-manager/*.log
          retention-days: 7
